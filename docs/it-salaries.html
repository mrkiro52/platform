<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Зарплаты в айти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08080A;
    --panel: #101014;
    --panel-2: #17171D;
    --border: #26262E;
    --text: #F6F6F4;
    --text-2: #C2C2BE;
    --text-3: #8B8B96;
    --accent: #FFD60A;
    --on-accent: #08080A;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); }
  body { width: 1600px; height: 800px; font-family: 'Manrope', system-ui, sans-serif; color: var(--text); }

  .card {
    width: 1600px; height: 800px; padding: 64px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
    background:
      radial-gradient(900px 420px at 100% 0%, rgba(255,214,10,0.10), transparent 60%),
      var(--bg);
    border: 1px solid var(--border);
  }
  .brand { font: 800 22px/1 'Unbounded', sans-serif; letter-spacing: .04em; color: var(--accent); }
  .head { display: flex; flex-direction: column; gap: 16px; }
  h1 { font: 800 60px/1.1 'Unbounded', sans-serif; letter-spacing: -.01em; }
  .sub { font: 600 26px/1.3 'Manrope', sans-serif; color: var(--text-2); }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .tier {
    background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
    padding: 32px 28px; display: flex; flex-direction: column; gap: 22px; min-height: 220px; justify-content: space-between;
  }
  .tier.is-top { background: var(--accent); border-color: var(--accent); }
  .level { font: 700 22px/1 'Unbounded', sans-serif; color: var(--text-2); }
  .tier.is-top .level { color: var(--on-accent); }
  .pay { font: 800 42px/1.05 'Unbounded', sans-serif; color: var(--text); white-space: nowrap; }
  .pay small { display: block; font: 700 18px/1 'Manrope', sans-serif; color: var(--text-3); margin-top: 12px; letter-spacing: .02em; }
  .tier.is-top .pay { color: var(--on-accent); }
  .tier.is-top .pay small { color: rgba(8,8,10,.65); }
  .tier .pay b { color: var(--accent); font-weight: 800; }
  .tier.is-top .pay b { color: var(--on-accent); }

  .foot { display: flex; justify-content: space-between; align-items: center; font: 600 18px/1 'Manrope', sans-serif; color: var(--text-3); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">KIRO PLATFORM</div>

    <div class="head">
      <h1>Зарплаты в айти (примерные)</h1>
      <div class="sub">Ориентиры в месяц</div>
    </div>

    <div class="grid">
      <div class="tier">
        <div class="level">Стажёр</div>
        <div class="pay"><b>80–100</b>к<small>₽ в месяц</small></div>
      </div>
      <div class="tier">
        <div class="level">Junior</div>
        <div class="pay"><b>100–150</b>к<small>₽ в месяц</small></div>
      </div>
      <div class="tier">
        <div class="level">Middle</div>
        <div class="pay"><b>150–250</b>к<small>₽ в месяц</small></div>
      </div>
      <div class="tier is-top">
        <div class="level">Senior</div>
        <div class="pay"><b>250к</b><small>и выше · ₽ в месяц</small></div>
      </div>
    </div>

    <div class="foot"><span>kiroplatform.ru</span></div>
  </div>
</body>
</html>
