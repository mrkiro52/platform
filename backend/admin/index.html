<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>KIRO Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2308080A'/%3E%3Cpath d='M10 8v16M10 16l9-8M13 13.5 21 24' stroke='%23FFD60A' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="/admin/admin.css"/>
</head>
<body>

<!-- ═══ ВХОД ═══ -->
<div id="login-screen" hidden>
  <form class="login-box" id="login-form" autocomplete="on">
    <div class="login-logo">KIRO<i></i><span>Admin Panel</span></div>
    <h1 class="login-title">Вход в админку</h1>
    <p class="login-sub">Нужен аккаунт с правами администратора.</p>
    <div id="login-err" class="form-error" role="alert" hidden></div>
    <div class="field">
      <label for="au">Логин</label>
      <input id="au" name="username" type="text" placeholder="Логин администратора" autocomplete="username" required/>
    </div>
    <div class="field">
      <label for="ap">Пароль</label>
      <div class="pw-wrap">
        <input id="ap" name="password" type="password" placeholder="Пароль" autocomplete="current-password" required/>
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Показать пароль"></button>
      </div>
    </div>
    <button class="btn btn-primary btn-lg btn-block" id="login-btn" type="submit">Войти</button>
    <p class="login-note">Это служебный раздел платформы KIRO.<br/>Обычный вход для участников — на <a href="/">kiroplatform.ru</a></p>
  </form>
</div>

<!-- ═══ ОБОЛОЧКА ═══ -->
<div id="app" hidden>
  <div class="sb-overlay" id="sb-overlay"></div>
  <aside class="sidebar" id="sidebar" aria-label="Разделы админки">
    <div class="sb-head">
      <div class="sb-logo">KIRO <span id="sb-role">Admin Panel</span></div>
      <button class="sb-close" id="sb-close" aria-label="Закрыть меню"></button>
    </div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot" id="sb-foot"></div>
  </aside>
  <header class="top-bar">
    <button class="btn-icon" id="menu-btn" aria-label="Открыть меню"></button>
    <div class="top-bar-title" id="top-title">KIRO Admin</div>
  </header>
  <main class="content"><div class="view" id="view"></div></main>
</div>

<div id="modal" class="modal-overlay" hidden><div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div></div>
<div id="toast" aria-live="polite"></div>

<script src="/admin/js/icons.js" defer></script>
<script src="/admin/js/core.js" defer></script>
<script src="/admin/js/charts.js" defer></script>
<script src="/admin/js/pages/dashboard.js" defer></script>
<script src="/admin/js/pages/tasks.js" defer></script>
<script src="/admin/js/pages/users.js" defer></script>
<script src="/admin/js/pages/announcements.js" defer></script>
<script src="/admin/js/pages/calls.js" defer></script>
<script src="/admin/js/pages/homework.js" defer></script>
<script src="/admin/js/pages/programs.js" defer></script>
<script src="/admin/js/pages/program-homework.js" defer></script>
<script src="/admin/js/boot.js" defer></script>
</body>
</html>
